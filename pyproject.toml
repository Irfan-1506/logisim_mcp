[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logisim-evolution-mcp"
version = "1.0.0"
description = "Create and edit native Logisim Evolution circuits through MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "defusedxml>=0.7.1,<1"]

[project.scripts]
logisim-evolution-mcp = "logisim_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logisim_mcp"]
